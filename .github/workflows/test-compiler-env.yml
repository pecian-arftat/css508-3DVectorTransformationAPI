name: C++ CI (GCC & Clang)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: Compile C++ Code
        run: |
          export CXX=${{ matrix.compiler }}
          # Adjust the files below to match your source files, or add cmake steps if using CMake
          $CXX -Wall -Wextra -std=c++20 test.cpp -o my_program
